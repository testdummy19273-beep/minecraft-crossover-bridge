name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  er-bridge:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: er-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make
      - run: make -j4
      - uses: actions/upload-artifact@v4
        with:
          name: er-bridge-dlls
          path: |
            er-bridge/build/dinput8.dll
            er-bridge/build/erbridge_core.dll

  mc-bridge:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mc-bridge
    steps:
      - uses: actions/checkout@v4
      - name: JDKs (21 for Minecraft toolchain, 25 for Gradle/Loom)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mc-bridge
      - run: ./gradlew build --no-daemon
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: er-bridge-mod
          path: mc-bridge/build/libs/*.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [er-bridge, mc-bridge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: true
          generate_release_notes: true
          body: |
            **Untested Windows + Prism Launcher port** of the Elden Ring half. It compiles, but nothing has been run against a real game yet.

            - `dinput8.dll` + `erbridge_core.dll`: put them where `scripts\install-er-bridge.ps1` expects (or just run the script from the repo).
            - `er-bridge-*.jar`: Fabric mod for Minecraft 1.21.1 (needs Fabric Loader and Fabric API).

            Offline only. Never go online with the bridge installed.
