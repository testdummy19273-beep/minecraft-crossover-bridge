name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  er-bridge:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
        working-directory: er-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make
      - run: make -j4
      - uses: actions/upload-artifact@v4
        with:
          name: er-bridge-dlls
          path: |
            er-bridge/build/dinput8.dll
            er-bridge/build/erbridge_core.dll

  mc-bridge:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mc-bridge
    steps:
      - uses: actions/checkout@v4
      - name: JDKs (21 for Minecraft toolchain, 25 for Gradle/Loom)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mc-bridge
      - run: ./gradlew build --no-daemon
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: er-bridge-mod
          path: mc-bridge/build/libs/*.jar
